name: Fetch bot logs

# EC2 上の bot コンテナのログを手動で取得する(再デプロイ・再起動はしない)。
# リポジトリは public のため Actions ログは誰でも閲覧できる点に注意。
# 既定ではレート追跡関連の行だけに絞り込む。
on:
  workflow_dispatch:
    inputs:
      pattern:
        description: 'grep -E で絞り込むパターン'
        required: false
        default: 'PuddleFarm|RankTracking|RankScheduler|rating_observations|puddle\.farm|grank|Error|error'
      lines:
        description: '出力する最大行数(末尾から)'
        required: false
        default: '200'

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch logs via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PATTERN: ${{ github.event.inputs.pattern }}
          LINES: ${{ github.event.inputs.lines }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PATTERN,LINES
          script: |
            case "$LINES" in ''|*[!0-9]*) LINES=200 ;; esac
            echo "=== container ==="
            docker ps -a --filter name=ggst-bot --format '{{.Names}} {{.Status}} (created {{.CreatedAt}})'
            echo "=== logs (filtered) ==="
            docker logs --timestamps ggst-bot 2>&1 | grep -E -- "$PATTERN" | tail -n "$LINES" || true

name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/ggst-discord-tool
            git fetch origin main
            git checkout main
            git pull origin main
            docker stop ggst-bot || true
            docker rm ggst-bot || true
            docker build --no-cache -t ggst-bot .
            docker run -d \
              --restart=always \
              --env-file .env \
              -p 8080:8080 \
              --name ggst-bot \
              ggst-bot
            echo "✅ Deploy complete"
            docker logs --tail=20 ggst-bot

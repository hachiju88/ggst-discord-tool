name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/ggst-discord-tool
            git fetch origin main
            git checkout main
            git pull origin main

            # ビルド前に空きディスクを最大化する。
            # 先に既存コンテナを停止・削除しておくと、それが使っていた旧イメージも
            # prune の対象になり最大限に回収できる（--no-cache ビルドの積み重ねで
            # ディスクが枯渇し npm install が "no space left on device" で失敗する
            # のを防ぐ）。ビルド中はBotが一時停止するが復旧は数分内。
            docker stop ggst-bot || true
            docker rm ggst-bot || true
            docker image prune -af || true
            docker builder prune -af || true

            docker build --no-cache -t ggst-bot .

            docker run -d \
              --restart=always \
              --env-file .env \
              -p 8080:8080 \
              --name ggst-bot \
              ggst-bot
            echo "✅ Deploy complete"

            docker logs --tail=20 ggst-bot

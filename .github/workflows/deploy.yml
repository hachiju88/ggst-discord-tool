name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/ggst-discord-tool
            git fetch origin main
            git checkout main
            git pull origin main

            # ディスク確保: 未使用イメージとビルドキャッシュを掃除する。
            # 稼働中コンテナが使用中のイメージは対象外なので安全。
            # （--no-cache ビルドの積み重ねでディスクが枯渇し、npm install が
            #   "no space left on device" で失敗するのを防ぐ）
            docker image prune -af || true
            docker builder prune -af || true

            # 新イメージを先にビルドし、成功してから既存コンテナを差し替える。
            # こうすることでビルド失敗時に稼働中のBotを落とさない（set -e で中断）。
            docker build --no-cache -t ggst-bot .

            docker stop ggst-bot || true
            docker rm ggst-bot || true
            docker run -d \
              --restart=always \
              --env-file .env \
              -p 8080:8080 \
              --name ggst-bot \
              ggst-bot
            echo "✅ Deploy complete"

            # 差し替えで不要になった旧イメージを掃除（次回に持ち越さない）。
            docker image prune -af || true

            docker logs --tail=20 ggst-bot
